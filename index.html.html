<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beyza’nın Haber Sitesi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <style>
:root{
  --bg:#f2f4f7;
  --surface:#ffffff;
  --ink:#16213a;
  --muted:#5c667a;
  --line:#dde2ea;
  --accent:#e4572e;

  --c-gundem:#16213a;
  --c-spor:#1f8a5b;
  --c-ekonomi:#b7791f;
  --c-teknoloji:#3a5bd9;
  --c-kultur:#9b3d8f;
  --c-saglik:#d1475b;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Source Serif 4",Georgia,serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.6;
  font-size:17px;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}

h1,h2,h3,.logo,.cats button,.tag,.ticker strong{font-family:"Bricolage Grotesque",system-ui,sans-serif}

/* ---------- Üst bölüm ---------- */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.topbar-inner{display:flex;align-items:center;gap:20px;padding-top:14px;padding-bottom:10px}
.logo{font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.logo span{color:var(--accent);font-weight:500;margin-left:2px}
.search{flex:1;max-width:340px;margin-left:auto}
.search input{
  width:100%;padding:9px 14px;border:1px solid var(--line);border-radius:999px;
  background:var(--bg);font:inherit;font-size:.95rem;color:var(--ink)
}
.date{color:var(--muted);font-size:.9rem;white-space:nowrap}

.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{
  border:0;background:transparent;color:var(--muted);
  padding:7px 14px;border-radius:999px;font-weight:700;font-size:.95rem;white-space:nowrap
}
.cats button:hover{background:var(--bg);color:var(--ink)}
.cats button.active{background:var(--ink);color:#fff}

/* ---------- Son dakika bandı ---------- */
.ticker{background:var(--ink);color:#fff;font-size:.95rem}
.ticker-inner{display:flex;gap:14px;align-items:center;padding-top:9px;padding-bottom:9px;overflow:hidden}
.ticker strong{background:var(--accent);padding:2px 10px;border-radius:4px;font-size:.85rem;flex:none}
#tickerText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Manşet ---------- */
main{padding-top:28px;padding-bottom:40px}
.hero{display:grid;grid-template-columns:1.7fr 1fr;gap:20px;margin-bottom:40px}
.hero-main{
  position:relative;min-height:440px;border-radius:14px;overflow:hidden;color:#fff;
  display:flex;align-items:flex-end;padding:32px;cursor:pointer;
  background:var(--cat-color,var(--ink))
}
.hero-main::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 80% 15%,rgba(255,255,255,.22),transparent 45%),
    linear-gradient(to top,rgba(10,15,30,.85),rgba(10,15,30,.05) 70%);
}
.hero-main > div{position:relative;max-width:620px}
.hero-main h1{font-size:clamp(1.8rem,3.6vw,2.7rem);line-height:1.12;letter-spacing:-.02em;margin:10px 0}
.hero-main p{opacity:.9}
.hero-side{display:flex;flex-direction:column;gap:14px}
.side-item{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:18px;cursor:pointer;flex:1;transition:border-color .15s
}
.side-item:hover{border-color:var(--cat-color)}
.side-item h3{font-size:1.15rem;line-height:1.25;margin:8px 0 6px}
.meta{color:var(--muted);font-size:.85rem}
.hero-main .meta{color:rgba(255,255,255,.8)}

.tag{
  display:inline-block;font-size:.78rem;font-weight:700;color:#fff;
  background:var(--cat-color,var(--ink));padding:2px 10px;border-radius:4px
}
.side-item .tag{background:transparent;color:var(--cat-color);padding:0}

/* ---------- Liste ve yan sütun ---------- */
.layout{display:grid;grid-template-columns:1fr 300px;gap:32px}
.section-title{font-size:1.35rem;font-weight:800;margin-bottom:16px;letter-spacing:-.01em}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s
}
.card:hover{border-color:var(--cat-color)}
.card-img{
  height:150px;background:var(--cat-color);position:relative;
  background-image:radial-gradient(circle at 85% 20%,rgba(255,255,255,.28),transparent 50%)
}
.card-img .tag{position:absolute;left:14px;bottom:12px;background:rgba(10,15,30,.55)}
.card-body{padding:16px 18px 18px}
.card h3{font-size:1.15rem;line-height:1.25;margin-bottom:8px}
.card p{color:var(--muted);font-size:.96rem;margin-bottom:10px}

.sidebar{position:sticky;top:130px;align-self:start}
.popular{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.popular li{padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:12px}
.popular li:last-child{border-bottom:0}
.popular li:hover h3{color:var(--accent)}
.popular .rank{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.5rem;color:var(--line);line-height:1}
.popular h3{font-size:1rem;line-height:1.3}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px;color:var(--muted)}

/* ---------- Haber penceresi ---------- */
.modal{
  border:0;border-radius:16px;max-width:720px;width:calc(100% - 32px);
  margin:auto;padding:0;background:var(--surface);color:var(--ink)
}
.modal::backdrop{background:rgba(10,15,30,.6)}
.modal-top{height:140px;background:var(--cat-color);background-image:radial-gradient(circle at 85% 20%,rgba(255,255,255,.28),transparent 50%)}
.modal-content{padding:28px 32px 36px}
.modal h2{font-size:clamp(1.6rem,3vw,2.1rem);line-height:1.15;margin:12px 0 8px;letter-spacing:-.02em}
.modal .text p{margin-top:16px}
.modal .lead{font-size:1.1rem;color:var(--muted)}
.close{
  position:absolute;top:14px;right:14px;border:0;background:#fff;color:var(--ink);
  padding:6px 14px;border-radius:999px;font-weight:700
}

.footer{border-top:1px solid var(--line);background:var(--surface);padding:24px 0;color:var(--muted);font-size:.9rem}

/* ---------- Mobil ---------- */
@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .hero-main{min-height:340px;padding:22px}
  .layout{grid-template-columns:1fr}
  .sidebar{position:static}
}
@media (max-width:600px){
  .date{display:none}
  .topbar-inner{flex-wrap:wrap;gap:10px}
  .logo{font-size:1.4rem}
  .search{flex-basis:100%;max-width:none;margin-left:0}
  .grid{grid-template-columns:1fr}
  .modal-content{padding:22px 20px 28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- Koyu tema ---------- */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1524;--surface:#18203a;--ink:#e8ecf5;--muted:#9aa5bd;--line:#2a3452;
    --c-gundem:#7f93c9;--c-ekonomi:#d69a3a;--c-teknoloji:#6d8bff;--c-kultur:#c36ab8;--c-spor:#3bb583;--c-saglik:#ec6b7f;
  }
  :root:not([data-theme="light"]) .ticker{background:#080c18}
  :root:not([data-theme="light"]) .cats button.active{color:#0f1524}
  :root:not([data-theme="light"]) .close{color:#16213a}
}
:root[data-theme="dark"]{
  --bg:#0f1524;--surface:#18203a;--ink:#e8ecf5;--muted:#9aa5bd;--line:#2a3452;
  --c-gundem:#7f93c9;--c-ekonomi:#d69a3a;--c-teknoloji:#6d8bff;--c-kultur:#c36ab8;--c-spor:#3bb583;--c-saglik:#ec6b7f;
}
:root[data-theme="dark"] .ticker{background:#080c18}
:root[data-theme="dark"] .cats button.active{color:#0f1524}
:root[data-theme="dark"] .close{color:#16213a}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg)}

</style>
</head>
<body>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="#" class="logo" id="logo">Beyza’nın<span>Haber Sitesi</span></a>
      <form class="search" id="searchForm" role="search">
        <input type="search" id="searchInput" placeholder="Haberlerde ara" aria-label="Haberlerde ara">
      </form>
      <time class="date" id="today"></time>
    </div>
    <nav class="wrap cats" id="cats" aria-label="Kategoriler"></nav>
  </header>

  <div class="ticker" aria-label="Son dakika">
    <div class="wrap ticker-inner">
      <strong>Son dakika</strong>
      <span id="tickerText"></span>
    </div>
  </div>

  <main class="wrap">
    <section id="hero" class="hero"></section>

    <div class="layout">
      <section>
        <h2 class="section-title" id="listTitle">Tüm haberler</h2>
        <div id="grid" class="grid"></div>
        <p id="empty" class="empty" hidden>Bu aramayla eşleşen haber yok. Başka bir kelime dene ya da kategoriyi değiştir.</p>
      </section>

      <aside class="sidebar">
        <h2 class="section-title">Çok okunanlar</h2>
        <ol id="popular" class="popular"></ol>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p>© <span id="year"></span> Beyza’nın Haber Sitesi. Bu sitedeki haberler örnek içeriktir.</p>
    </div>
  </footer>

  <!-- Haber detay penceresi -->
  <dialog id="modal" class="modal">
    <article id="modalBody"></article>
    <button class="close" id="closeBtn" aria-label="Kapat">Kapat</button>
  </dialog>

  <script>
/* ------------------------------------------------------------
   HABERLER: Yeni haber eklemek için listeye bir nesne ekle.
   id: benzersiz sayı | kategori: aşağıdaki KATEGORILER'den biri
   okunma: "Çok okunanlar" sıralaması için kullanılır
------------------------------------------------------------ */
const KATEGORILER = {
  gundem:    { ad: "Gündem",    renk: "var(--c-gundem)" },
  spor:      { ad: "Spor",      renk: "var(--c-spor)" },
  ekonomi:   { ad: "Ekonomi",   renk: "var(--c-ekonomi)" },
  teknoloji: { ad: "Teknoloji", renk: "var(--c-teknoloji)" },
  kultur:    { ad: "Kültür",    renk: "var(--c-kultur)" },
  saglik:    { ad: "Sağlık",    renk: "var(--c-saglik)" },
};

const HABERLER = [
  {
    id: 1, kategori: "gundem", tarih: "2026-11-06T09:30:00", okunma: 5400,
    baslik: "Belediyeden toplu taşımada yeni dönem: Tek kartla tüm hatlar",
    ozet: "Şehirde otobüs, tramvay ve vapur tek bir kartla kullanılabilecek. Uygulama gelecek ay başlıyor.",
    metin: [
      "Belediye meclisinde kabul edilen düzenlemeyle şehirdeki tüm toplu taşıma araçları tek kart sistemine bağlanıyor. Yolcular artık farklı hatlar için ayrı kart almak zorunda kalmayacak.",
      "Yetkililer, aktarma indiriminin de yeni sistemle birlikte iki saate çıkarılacağını açıkladı. Kartlar mevcut bakiyeleriyle birlikte otomatik olarak yeni sisteme taşınacak.",
      "Uygulamanın ilk haftasında bilgilendirme noktaları kurulacak ve gönüllü ekipler durak ve iskelelerde yolculara yardımcı olacak."
    ]
  },
  {
    id: 2, kategori: "spor", tarih: "2026-11-06T08:10:00", okunma: 7200,
    baslik: "Derbide son dakika golü: Lider takım puan farkını açtı",
    ozet: "Haftanın en çok beklenen maçında kazanan 90+3. dakikada belli oldu.",
    metin: [
      "Dolu tribünlerin önünde oynanan karşılaşma, ilk yarıda temkinli başladı. İkinci yarıda tempo yükseldi ve iki takım da net fırsatlar yakaladı.",
      "Maçın sonuna doğru oyuna giren yedek oyuncu, uzatma dakikalarında kafa vuruşuyla skoru belirledi.",
      "Bu sonuçla lider takım, ikinci sıradaki rakibiyle arasındaki farkı beş puana çıkardı."
    ]
  },
  {
    id: 3, kategori: "ekonomi", tarih: "2026-11-05T17:45:00", okunma: 3900,
    baslik: "Küçük işletmelere düşük faizli destek kredisi paketi açıklandı",
    ozet: "Esnaf ve küçük işletmeler için yeni finansman paketinin başvuruları önümüzdeki hafta başlıyor.",
    metin: [
      "Yeni paket, yıllık cirosu belirli bir sınırın altındaki işletmeleri kapsıyor. Kredilerin geri ödemesine altı ay ödemesiz dönem de eklendi.",
      "Başvurular bankaların şubelerinden ve internet bankacılığı üzerinden yapılabilecek. Başvuru için gerekli belgeler listesi yetkili kurumun internet sitesinde yayımlandı."
    ]
  },
  {
    id: 4, kategori: "teknoloji", tarih: "2026-11-05T14:20:00", okunma: 6100,
    baslik: "Yerli yazılım ekibinden telefonlar için yeni ücretsiz çeviri uygulaması",
    ozet: "İnternet bağlantısı olmadan da çalışan uygulama, 40'tan fazla dili destekliyor.",
    metin: [
      "Üniversite mezunu genç bir ekibin geliştirdiği uygulama, yapay zekâ modellerini doğrudan telefonda çalıştırıyor. Bu sayede çeviri için internete ihtiyaç duyulmuyor.",
      "Geliştiriciler, uygulamanın reklam içermeyeceğini ve kullanıcı verilerini sunuculara göndermeyeceğini belirtti."
    ]
  },
  {
    id: 5, kategori: "kultur", tarih: "2026-11-04T19:00:00", okunma: 2300,
    baslik: "Uluslararası film festivali bu yıl 120 filmle perdelerini açıyor",
    ozet: "Festival boyunca ücretsiz gösterimler ve yönetmen söyleşileri yapılacak.",
    metin: [
      "On gün sürecek festivalde yarışma bölümünün yanı sıra belgesel ve kısa film seçkileri de izleyiciyle buluşacak.",
      "Biletler festival gişelerinden ve internet sitesinden alınabilecek. Öğrenciler için özel indirim uygulanacak."
    ]
  },
  {
    id: 6, kategori: "saglik", tarih: "2026-11-04T11:15:00", okunma: 4500,
    baslik: "Uzmanlardan kış uyarısı: Grip aşısı için en uygun zaman şimdi",
    ozet: "Hava soğurken mevsimsel hastalıklar artıyor. Risk grubundakilere erken aşı öneriliyor.",
    metin: [
      "Uzmanlar, aşının koruyuculuğunun uygulamadan yaklaşık iki hafta sonra başladığını hatırlatıyor. Bu nedenle salgın dönemi başlamadan yaptırılması öneriliyor.",
      "65 yaş üstü kişiler, kronik rahatsızlığı olanlar ve hamileler öncelikli risk grubunda yer alıyor. Aşı konusunda aile hekimine danışılabilir."
    ]
  },
  {
    id: 7, kategori: "spor", tarih: "2026-11-03T21:40:00", okunma: 1800,
    baslik: "Genç yüzücü ulusal rekoru bir kez daha geliştirdi",
    ozet: "17 yaşındaki sporcu, 200 metre serbest stilde kendi rekorunu iki saniye aştı.",
    metin: [
      "Havuz başında büyük coşku yaşandı. Sporcu, rekorun ardından hedefinin gelecek yılki uluslararası yarışmalarda finale kalmak olduğunu söyledi."
    ]
  },
  {
    id: 8, kategori: "gundem", tarih: "2026-11-03T10:00:00", okunma: 2900,
    baslik: "Şehrin merkezindeki tarihi çarşı restorasyonla yeniden açılıyor",
    ozet: "İki yıl süren çalışmanın ardından 150 yıllık çarşı hafta sonu ziyaretçilere açılacak.",
    metin: [
      "Restorasyonda özgün taş işçiliği korunurken çatı ve altyapı tamamen yenilendi. Çarşıda 80'den fazla dükkân yeniden hizmet verecek.",
      "Açılış töreninin ardından hafta sonu boyunca el sanatları atölyeleri ve müzik dinletileri düzenlenecek."
    ]
  },
  {
    id: 9, kategori: "ekonomi", tarih: "2026-11-02T16:30:00", okunma: 1500,
    baslik: "Yerel üreticilerden pazar yerlerinde doğrudan satış hamlesi",
    ozet: "Çiftçiler ürünlerini aracısız satabileceği yeni pazar alanlarında stand açıyor.",
    metin: [
      "Yeni alanlar hafta sonları kurulacak. Tüketiciler sebze, meyve ve süt ürünlerini üreticiden doğrudan alabilecek."
    ]
  },
];

/* ---------------- Yardımcı fonksiyonlar ---------------- */
const $ = (s) => document.querySelector(s);
let aktifKategori = "hepsi";
let aramaMetni = "";

const tarihYaz = (iso, uzun = false) =>
  new Date(iso).toLocaleDateString("tr-TR",
    uzun ? { day: "numeric", month: "long", year: "numeric" } : { day: "numeric", month: "long" });

const kat = (id) => KATEGORILER[id];

function filtrele() {
  const q = aramaMetni.trim().toLocaleLowerCase("tr-TR");
  return HABERLER
    .filter(h => aktifKategori === "hepsi" || h.kategori === aktifKategori)
    .filter(h => !q || (h.baslik + " " + h.ozet).toLocaleLowerCase("tr-TR").includes(q))
    .sort((a, b) => new Date(b.tarih) - new Date(a.tarih));
}

/* ---------------- Çizim fonksiyonları ---------------- */
function kategorileriCiz() {
  const nav = $("#cats");
  const liste = [["hepsi", "Tümü"], ...Object.entries(KATEGORILER).map(([id, k]) => [id, k.ad])];
  nav.innerHTML = liste.map(([id, ad]) =>
    `<button data-kat="${id}" class="${id === aktifKategori ? "active" : ""}">${ad}</button>`
  ).join("");
}

function mansetCiz(liste) {
  const hero = $("#hero");
  // Arama yapılıyorsa manşeti gizle
  if (aramaMetni || liste.length < 3) { hero.hidden = true; return liste; }
  hero.hidden = false;
  const [ana, ...kalan] = liste;
  const yan = kalan.slice(0, 2);
  hero.innerHTML = `
    <article class="hero-main" data-id="${ana.id}" style="--cat-color:${kat(ana.kategori).renk}" tabindex="0" role="button">
      <div>
        <span class="tag">${kat(ana.kategori).ad}</span>
        <h1>${ana.baslik}</h1>
        <p>${ana.ozet}</p>
        <span class="meta">${tarihYaz(ana.tarih)}</span>
      </div>
    </article>
    <div class="hero-side">
      ${yan.map(h => `
        <article class="side-item" data-id="${h.id}" style="--cat-color:${kat(h.kategori).renk}" tabindex="0" role="button">
          <span class="tag">${kat(h.kategori).ad}</span>
          <h3>${h.baslik}</h3>
          <span class="meta">${tarihYaz(h.tarih)}</span>
        </article>`).join("")}
    </div>`;
  return kalan.slice(2); // manşette kullanılanlar listeden çıkar
}

function kartlariCiz(liste) {
  $("#grid").innerHTML = liste.map(h => `
    <article class="card" data-id="${h.id}" style="--cat-color:${kat(h.kategori).renk}" tabindex="0" role="button">
      <div class="card-img"><span class="tag">${kat(h.kategori).ad}</span></div>
      <div class="card-body">
        <h3>${h.baslik}</h3>
        <p>${h.ozet}</p>
        <span class="meta">${tarihYaz(h.tarih)}</span>
      </div>
    </article>`).join("");
}

function cokOkunanlariCiz() {
  const ilk5 = [...HABERLER].sort((a, b) => b.okunma - a.okunma).slice(0, 5);
  $("#popular").innerHTML = ilk5.map((h, i) => `
    <li data-id="${h.id}" tabindex="0" role="button">
      <span class="rank">${i + 1}</span>
      <h3>${h.baslik}</h3>
    </li>`).join("");
}

function sayfayiGuncelle() {
  const sonuc = filtrele();
  const kalan = mansetCiz(aramaMetni ? sonuc : sonuc);
  const listelenecek = aramaMetni || sonuc.length < 3 ? sonuc : kalan;
  kartlariCiz(listelenecek);

  $("#empty").hidden = sonuc.length > 0;
  $("#listTitle").textContent =
    aramaMetni ? `“${aramaMetni}” için sonuçlar`
    : aktifKategori === "hepsi" ? "Tüm haberler"
    : kat(aktifKategori).ad;
}

/* ---------------- Haber penceresi ---------------- */
function haberAc(id) {
  const h = HABERLER.find(x => x.id === Number(id));
  if (!h) return;
  $("#modalBody").innerHTML = `
    <div class="modal-top" style="--cat-color:${kat(h.kategori).renk}"></div>
    <div class="modal-content" style="--cat-color:${kat(h.kategori).renk}">
      <span class="tag">${kat(h.kategori).ad}</span>
      <h2>${h.baslik}</h2>
      <span class="meta">${tarihYaz(h.tarih, true)}</span>
      <div class="text">
        <p class="lead">${h.ozet}</p>
        ${h.metin.map(p => `<p>${p}</p>`).join("")}
      </div>
    </div>`;
  $("#modal").showModal();
}

/* ---------------- Olaylar ---------------- */
document.addEventListener("click", (e) => {
  const katBtn = e.target.closest("[data-kat]");
  if (katBtn) {
    aktifKategori = katBtn.dataset.kat;
    kategorileriCiz();
    sayfayiGuncelle();
    return;
  }
  const haber = e.target.closest("[data-id]");
  if (haber) haberAc(haber.dataset.id);
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const haber = e.target.closest("[data-id]");
    if (haber) haberAc(haber.dataset.id);
  }
});

$("#searchInput").addEventListener("input", (e) => {
  aramaMetni = e.target.value;
  sayfayiGuncelle();
});
$("#searchForm").addEventListener("submit", (e) => e.preventDefault());

$("#closeBtn").addEventListener("click", () => $("#modal").close());
$("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") $("#modal").close(); });

$("#logo").addEventListener("click", (e) => {
  e.preventDefault();
  aktifKategori = "hepsi"; aramaMetni = ""; $("#searchInput").value = "";
  kategorileriCiz(); sayfayiGuncelle();
  window.scrollTo({ top: 0 });
});

/* ---------------- Başlangıç ---------------- */
$("#today").textContent = new Date().toLocaleDateString("tr-TR",
  { weekday: "long", day: "numeric", month: "long", year: "numeric" });
$("#year").textContent = new Date().getFullYear();
$("#tickerText").textContent = [...HABERLER]
  .sort((a, b) => new Date(b.tarih) - new Date(a.tarih))[0].baslik;

kategorileriCiz();
cokOkunanlariCiz();
sayfayiGuncelle();

</script>
</body>
</html>
